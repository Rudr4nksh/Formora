<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Your profile — Formora</title><link rel="stylesheet" href="/styles.css"></head><body><div class="shell"><nav class="nav"><div class="brand">Formora <span>AI</span></div><form action="/logout" method="post"><button class="btn secondary">Log out</button></form></nav><main><section class="card"><h1>Your saved profile</h1><p>Here are the details currently saved for your account.</p><div id="details" class="details"></div><div class="actions"><a class="btn secondary" href="/profile.html">Edit profile</a></div></section></main></div><script>fetch('/api/me').then(r=>r.ok?r.json():Promise.reject()).then(({user,profile})=>{if(!profile){location='/profile.html';return}const values=[['Email',user.email],['Full name',profile.full_name],['Date of birth',profile.date_of_birth],['Phone',profile.phone],['About',profile.bio],['Accessibility needs',profile.accessibility_needs]];details.innerHTML=values.filter(([,v])=>v).map(([k,v])=>`<div class="detail"><b>${k}</b><span></span></div>`).join('');[...details.children].forEach((el,i)=>el.lastElementChild.textContent=values.filter(([,v])=>v)[i][1])}).catch(()=>location='/');</script></body></html>
