<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Formora AI — Sign in</title><link rel="stylesheet" href="/styles.css"></head><body><div class="shell"><nav class="nav"><div class="brand">Formora <span>AI</span></div><span>Forms that build themselves</span></nav><main><section class="card"><h1>Welcome to Formora</h1><p>Create an account or sign in to complete your profile.</p><div id="error" class="alert" hidden></div><div class="tabs"><a class="tab active" href="#register">Create account</a><a class="tab" href="#login">Sign in</a></div><form id="register" action="/register" method="post"><div class="field"><label>Email address</label><input type="email" name="email" autocomplete="email" required></div><div class="field"><label>Create a password</label><input type="password" name="password" autocomplete="new-password" minlength="8" required><p class="hint">Use at least 8 characters.</p></div><button class="btn wide">Create account</button></form><form id="login" action="/login" method="post" hidden><div class="field"><label>Email address</label><input type="email" name="email" autocomplete="email" required></div><div class="field"><label>Password</label><input type="password" name="password" autocomplete="current-password" required></div><button class="btn wide">Sign in</button></form></section></main></div><script>const p=new URLSearchParams(location.search),e=p.get('error');if(e){error.textContent=e;error.hidden=false}document.querySelectorAll('.tab').forEach(t=>t.onclick=e=>{e.preventDefault();document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));t.classList.add('active');register.hidden=t.hash!=='#register';login.hidden=t.hash!=='#login'});</script></body></html>
