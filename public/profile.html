<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Set up profile — Formora</title><link rel="stylesheet" href="/styles.css"></head><body><div class="shell"><nav class="nav"><div class="brand">Formora <span>AI</span></div><form action="/logout" method="post"><button class="btn secondary">Log out</button></form></nav><main><section class="card"><h1>Set up your profile</h1><p>These details are saved securely to your profile.</p><div id="error" class="alert" hidden></div><form action="/profile" method="post"><div class="field"><label>Full name</label><input name="fullName" autocomplete="name" required></div><div class="field"><label>Date of birth</label><input type="date" name="dateOfBirth" autocomplete="bday"></div><div class="field"><label>Phone number</label><input type="tel" name="phone" autocomplete="tel"></div><div class="field"><label>About you</label><textarea name="bio" rows="3" placeholder="A short introduction"></textarea></div><div class="field"><label>Accessibility needs</label><input name="accessibilityNeeds" placeholder="Optional"></div><button class="btn wide">Save profile</button></form></section></main></div><script>const e=new URLSearchParams(location.search).get('error');if(e){error.textContent=e;error.hidden=false}fetch('/api/me').then(r=>r.ok?r.json():null).then(d=>{if(!d?.profile)return;const p=d.profile;Object.entries({fullName:p.full_name,dateOfBirth:p.date_of_birth,phone:p.phone,bio:p.bio,accessibilityNeeds:p.accessibility_needs}).forEach(([k,v])=>{if(v)document.querySelector(`[name=${k}]`).value=v})});</script></body></html>
