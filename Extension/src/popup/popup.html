<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Formora</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header class="header">
    <span class="logo">Formora</span>
    <label class="switch">
      <input type="checkbox" id="masterToggle" />
      <span class="slider"></span>
    </label>
  </header>

  <main id="controls" class="controls">
    <section class="field">
      <label for="fontSize">Font size</label>
      <select id="fontSize">
        <option value="small">Small</option>
        <option value="medium" selected>Medium</option>
        <option value="large">Large</option>
        <option value="x-large">Extra large</option>
      </select>
    </section>

    <section class="field">
      <label for="contentDensity">Content density</label>
      <select id="contentDensity">
        <option value="low">Low (spacious)</option>
        <option value="medium" selected>Medium</option>
        <option value="high">High (compact)</option>
      </select>
    </section>

    <section class="field checkbox-field">
      <label for="simplifyNavigation">Simplify navigation</label>
      <input type="checkbox" id="simplifyNavigation" />
    </section>

    <section class="field checkbox-field">
      <label for="highlightActions">Highlight action buttons</label>
      <input type="checkbox" id="highlightActions" />
    </section>

    <section class="field checkbox-field">
      <label for="reduceVisualClutter">Reduce visual clutter</label>
      <input type="checkbox" id="reduceVisualClutter" />
    </section>

    <button id="applyBtn" class="primary-btn">Apply to this page</button>
    <p id="status" class="status"></p>
  </main>

  <script src="popup.js"></script>
</body>
</html>
